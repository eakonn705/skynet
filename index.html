<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skynet Like</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0c0a;
    --panel:#17140f;
    --panel-2:#1e1a13;
    --gold:#b8934a;
    --gold-bright:#e3c583;
    --white:#ede7d8;
    --muted:#8a8378;
    --border:rgba(184,147,74,0.32);
    --danger:#8a3b3b;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    min-height:100vh;
    background-color:var(--bg);
    background-image:
      linear-gradient(180deg, rgba(13,12,10,0.86) 0%, rgba(13,12,10,0.93) 60%, rgba(13,12,10,0.97) 100%),
      url('background.png');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:var(--white);
    font-family:'Zen Kaku Gothic New', sans-serif;
    position:relative;
    padding-bottom:120px;
  }

  /* 走査線オーバーレイ(端末/ネットワークの雰囲気) */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:1;
  }

  header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:16px;
    padding:28px clamp(16px,4vw,48px) 20px;
    border-bottom:1px solid var(--border);
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }

  h1{
    margin:0;
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:clamp(20px,2.6vw,28px);
    letter-spacing:0.04em;
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(227,197,131,0.25);
  }

  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 8px var(--gold-bright);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }

  .summary-btn{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.03em;
    color:var(--gold-bright);
    background:transparent;
    border:1px solid var(--border);
    padding:9px 16px;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
  }
  .summary-btn:hover{
    background:rgba(184,147,74,0.1);
    border-color:var(--gold);
  }
  .summary-btn:disabled{opacity:0.5; cursor:default;}

  main{
    position:relative;
    z-index:2;
    max-width:720px;
    margin:0 auto;
    padding:28px clamp(16px,4vw,48px) 40px;
  }

  #ai-panel{
    display:none;
    margin-bottom:28px;
    padding:18px 20px;
    background:var(--panel-2);
    border:1px solid var(--gold);
    border-left:3px solid var(--gold-bright);
  }
  #ai-panel.show{display:block;}
  #ai-panel .ai-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--gold-bright);
    letter-spacing:0.08em;
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
  }
  #ai-panel .ai-label button{
    background:none;border:none;color:var(--muted);
    cursor:pointer;font-family:inherit;font-size:11px;
  }
  #ai-panel .ai-body{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    line-height:1.7;
    color:var(--white);
    white-space:pre-wrap;
  }

  .posts-heading{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.08em;
    margin:0 0 14px;
  }

  #posts{
    display:flex;
    flex-direction:column;
  }

  .post{
    padding:16px 4px;
    border-top:1px solid var(--border);
    transition:padding-left 0.15s, border-color 0.15s;
  }
  .post:hover{
    padding-left:12px;
    border-color:var(--gold);
  }
  .post:last-child{border-bottom:1px solid var(--border);}

  .post-time{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.03em;
  }

  .post-content{
    margin-top:6px;
    font-family:'Shippori Mincho', serif;
    font-size:16px;
    line-height:1.85;
    color:var(--white);
    word-break:break-word;
    white-space:pre-wrap;
  }

  .empty{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
    padding:24px 4px;
  }

  footer{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:3;
    background:rgba(13,12,10,0.94);
    border-top:1px solid var(--border);
    backdrop-filter:blur(4px);
    padding:14px clamp(16px,4vw,48px);
  }

  .composer{
    max-width:720px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }

  #type-input{
    flex:1;
    resize:none;
    height:44px;
    max-height:120px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--white);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14px;
    padding:11px 12px;
    outline:none;
  }
  #type-input:focus{border-color:var(--gold);}

  .composer button{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:12px 16px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--white);
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s, border-color 0.15s, color 0.15s;
  }
  #post-btn{color:var(--white);}
  #post-btn:hover{border-color:var(--gold-bright); color:var(--gold-bright);}
  #ask-btn{color:var(--gold-bright); border-color:var(--gold);}
  #ask-btn:hover{background:rgba(184,147,74,0.12);}
  .composer button:disabled{opacity:0.45; cursor:default;}

  .hint{
    max-width:720px;
    margin:6px auto 0;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Skynet Like</h1>
    <span class="status-dot"></span>
  </div>
  <button class="summary-btn" id="summary-btn">今日の要約</button>
</header>

<main>
  <div id="ai-panel">
    <div class="ai-label">
      <span id="ai-panel-title">AI応答</span>
      <button id="ai-panel-close">閉じる ×</button>
    </div>
    <div class="ai-body" id="ai-panel-body">生成中...</div>
  </div>

  <p class="posts-heading">TODAY'S POSTS</p>
  <div id="posts">
    <p class="empty">読み込み中...</p>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="type-input" placeholder="投稿する、またはAIに質問する..." maxlength="500"></textarea>
    <button id="post-btn">投稿する</button>
    <button id="ask-btn">AIに質問</button>
  </div>
  <p class="hint">匿名投稿・文章のみ対応</p>
</footer>

<script>
/* ▼▼▼ ここにデプロイしたCloudflare WorkerのURLを設定してください ▼▼▼ */
const WORKER_URL = "https://proud-dew-b8a0.18-kota-shobun.workers.dev";
/* ▲▲▲ ここまで ▲▲▲ ---------------------------------------------- */

const postsEl = document.getElementById('posts');
const input = document.getElementById('type-input');
const postBtn = document.getElementById('post-btn');
const askBtn = document.getElementById('ask-btn');
const summaryBtn = document.getElementById('summary-btn');
const aiPanel = document.getElementById('ai-panel');
const aiPanelTitle = document.getElementById('ai-panel-title');
const aiPanelBody = document.getElementById('ai-panel-body');
document.getElementById('ai-panel-close').onclick = () => aiPanel.classList.remove('show');

function fmtTime(iso){
  // "YYYY-MM-DD HH:MM:SS" 形式(JST済み)から HH:MM のみ表示
  const m = iso.match(/(\d{2}):(\d{2})/);
  return m ? `${m[1]}:${m[2]}` : iso;
}

async function loadPosts(){
  try{
    const res = await fetch(`${WORKER_URL}/api/posts`);
    const data = await res.json();
    if(!data.posts || !data.posts.length){
      postsEl.innerHTML = '<p class="empty">本日の投稿はまだありません。最初の投稿をしてみましょう。</p>';
      return;
    }
    postsEl.innerHTML = data.posts.map(p => `
      <div class="post">
        <div class="post-time">${fmtTime(p.created_at)}</div>
        <div class="post-content"></div>
      </div>
    `).join('');
    // XSS対策: textContentで挿入
    const bodies = postsEl.querySelectorAll('.post-content');
    data.posts.forEach((p, i) => { bodies[i].textContent = p.content; });
  }catch(e){
    postsEl.innerHTML = '<p class="empty">投稿の読み込みに失敗しました。WORKER_URLの設定を確認してください。</p>';
  }
}

function showAiPanel(title, text){
  aiPanelTitle.textContent = title;
  aiPanelBody.textContent = text;
  aiPanel.classList.add('show');
}

async function runAi(mode, question){
  const busyButtons = [summaryBtn, askBtn, postBtn];
  busyButtons.forEach(b => b.disabled = true);
  showAiPanel(mode === 'summary' ? '今日の要約' : 'AIの回答', '生成中...');
  try{
    const res = await fetch(`${WORKER_URL}/api/ai`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(mode === 'summary' ? {mode} : {mode, question})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    showAiPanel(mode === 'summary' ? '今日の要約' : 'AIの回答', data.text);
  }catch(e){
    showAiPanel('エラー', 'AI応答の取得に失敗しました。WORKER_URL・APIキーの設定を確認してください。');
  }finally{
    busyButtons.forEach(b => b.disabled = false);
  }
}

summaryBtn.onclick = () => runAi('summary');

askBtn.onclick = () => {
  const q = input.value.trim();
  if(!q) return;
  runAi('ask', q);
  input.value = '';
};

postBtn.onclick = async () => {
  const text = input.value.trim();
  if(!text) return;
  postBtn.disabled = true;
  try{
    const res = await fetch(`${WORKER_URL}/api/posts`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content: text})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    input.value = '';
    await loadPosts();
  }catch(e){
    alert('投稿に失敗しました。WORKER_URLの設定を確認してください。');
  }finally{
    postBtn.disabled = false;
  }
};

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    postBtn.click();
  }
});

loadPosts();
</script>
</body>
</html>
