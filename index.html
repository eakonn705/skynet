<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skynet Like</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  :root{
    --bg:#0d0c0a;
    --panel:rgba(23,20,15,0.72);
    --panel-solid:#17140f;
    --panel-2:#1e1a13;
    --gold:#b8934a;
    --gold-bright:#e3c583;
    --white:#ede7d8;
    --muted:#8a8378;
    --border:rgba(184,147,74,0.32);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg) url('background.png') center / cover fixed no-repeat;
    color:var(--white);
    font-family:'Zen Kaku Gothic New', sans-serif;
    position:relative;
    overflow-x:hidden;
  }

  /* 背景画像の上に薄く暗さを重ねるだけ(画像は透けて見える) */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(13,12,10,0.55), rgba(13,12,10,0.72));
    z-index:0;
  }
  /* 走査線オーバーレイ */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    z-index:1;
  }

  #app{ position:relative; z-index:2; display:flex; flex-direction:column; min-height:100vh; }

  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px clamp(16px,3vw,32px);
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  h1{
    margin:0;
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:clamp(20px,2.4vw,26px);
    letter-spacing:0.04em;
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(227,197,131,0.25);
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 8px var(--gold-bright);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* ヘッダー内の要約ボタン(スマホ用) */
  #summary-btn-mobile{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--gold-bright);
    background:transparent;
    border:1px solid var(--border);
    padding:8px 14px;
    cursor:pointer;
  }
  #summary-btn-mobile:hover{ background:rgba(184,147,74,0.1); border-color:var(--gold); }

  /* ===== レイアウト本体 ===== */
  #layout{ flex:1; display:flex; width:100%; min-height:0; }

  /* ---- 掲示板(共通) ---- */
  #board-col{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  #board-scroll{
    flex:1;
    overflow-y:auto;
    padding:24px clamp(16px,3vw,32px) 16px;
  }
  .posts-heading{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.08em;
    margin:0 0 14px;
  }
  #posts{ display:flex; flex-direction:column; max-width:720px; }
  .post{ padding:16px 4px; border-top:1px solid var(--border); transition:padding-left .15s, border-color .15s; }
  .post:hover{ padding-left:12px; border-color:var(--gold); }
  .post:last-child{ border-bottom:1px solid var(--border); }
  .post-time{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); }
  .post-content{
    margin-top:6px; font-family:'Shippori Mincho', serif; font-size:16px; line-height:1.85;
    color:var(--white); word-break:break-word; white-space:pre-wrap;
  }
  .empty{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--muted); padding:24px 4px; }

  /* 掲示板側の投稿バー(PCではここが唯一の投稿手段) */
  #board-composer{
    border-top:1px solid var(--border);
    background:var(--panel);
    padding:12px clamp(16px,3vw,32px);
    display:flex;
    gap:10px;
  }
  #board-input{
    flex:1; resize:none; height:44px; max-height:110px;
    background:var(--panel-solid); border:1px solid var(--border); color:var(--white);
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:14px; padding:11px 12px; outline:none;
  }
  #board-input:focus{ border-color:var(--gold); }
  #board-post-btn{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:13px;
    padding:0 18px; border:1px solid var(--border); background:transparent; color:var(--white); cursor:pointer;
  }
  #board-post-btn:hover{ border-color:var(--gold-bright); color:var(--gold-bright); }
  #board-post-btn:disabled{ opacity:.45; cursor:default; }

  /* ---- PC専用: 右側AIアシスタント常駐カラム ---- */
  #ai-col{
    width:34%;
    max-width:420px;
    min-width:280px;
    border-left:1px solid var(--border);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #summary-btn-wrap{ padding:18px 16px 10px; text-align:center; }
  #summary-btn-desktop{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--gold-bright);
    background:transparent; border:1px solid var(--gold); padding:10px 18px; cursor:pointer;
    letter-spacing:.03em;
  }
  #summary-btn-desktop:hover{ background:rgba(184,147,74,0.12); }
  #summary-btn-desktop.hidden{ display:none; }

  .ai-name{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px;
    color:var(--muted); letter-spacing:.1em; padding:0 16px 10px; border-bottom:1px solid var(--border);
  }

  #chat-log{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:14px; }
  .msg{ max-width:100%; }
  .msg .who{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.06em; margin-bottom:4px;
  }
  .msg.user .who{ color:var(--muted); text-align:right; }
  .msg.ai .who{ color:var(--gold-bright); }
  .msg.user .bubble{
    background:var(--panel-solid); border:1px solid var(--border); padding:10px 12px;
    font-size:13.5px; color:var(--white); margin-left:auto; max-width:90%; white-space:pre-wrap;
  }
  .msg.ai .bubble{
    border-left:2px solid var(--gold); padding:4px 0 4px 12px; font-size:13.5px; line-height:1.75; color:var(--white);
  }
  .msg.ai .bubble.loading{ color:var(--muted); font-family:'JetBrains Mono', monospace; }
  .msg.ai .bubble p{ margin:0 0 8px; }
  .msg.ai .bubble p:last-child{ margin-bottom:0; }
  .msg.ai .bubble code{ font-family:'JetBrains Mono', monospace; background:rgba(184,147,74,0.12); padding:1px 4px; }
  .msg.ai .bubble pre{ background:rgba(0,0,0,0.35); padding:10px; overflow-x:auto; }
  .msg.ai .bubble ul, .msg.ai .bubble ol{ padding-left:1.2em; }

  #chat-input-wrap{ border-top:1px solid var(--border); padding:12px 14px; display:flex; gap:8px; }
  #chat-input{
    flex:1; resize:none; height:42px; max-height:100px;
    background:var(--panel-solid); border:1px solid var(--border); color:var(--white);
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:13.5px; padding:10px; outline:none;
  }
  #chat-input:focus{ border-color:var(--gold); }
  #chat-send{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:13px;
    padding:0 14px; border:1px solid var(--gold); color:var(--gold-bright); background:transparent; cursor:pointer;
  }
  #chat-send:hover{ background:rgba(184,147,74,0.12); }
  #chat-send:disabled{ opacity:.45; cursor:default; }

  /* ---- スマホ専用: 下部固定バー ---- */
  #mobile-bar{ display:none; }

  /* ===== ブレークポイント切り替え ===== */
  @media (max-width: 899px){
    #ai-col{ display:none; }
    #board-composer{ display:none; } /* スマホでは下部バーに統合 */
    #board-scroll{ padding-bottom:150px; }

    #mobile-bar{
      display:block;
      position:fixed; left:0; right:0; bottom:0; z-index:5;
      background:rgba(13,12,10,0.95);
      border-top:1px solid var(--border);
      backdrop-filter:blur(4px);
    }
    #mobile-ai-panel{
      display:none;
      max-height:45vh;
      overflow-y:auto;
      padding:14px 16px;
      border-bottom:1px solid var(--border);
    }
    #mobile-ai-panel.show{ display:flex; flex-direction:column; gap:14px; }
    #mobile-composer{ display:flex; gap:8px; align-items:flex-end; padding:12px clamp(16px,4vw,32px); }
    #mobile-input{
      flex:1; resize:none; height:44px; max-height:110px;
      background:var(--panel-solid); border:1px solid var(--border); color:var(--white);
      font-family:'Zen Kaku Gothic New', sans-serif; font-size:14px; padding:11px 12px; outline:none;
    }
    #mobile-input:focus{ border-color:var(--gold); }
    #mobile-composer button{
      font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:12.5px;
      padding:0 12px; height:44px; border:1px solid var(--border); background:transparent; color:var(--white); cursor:pointer; white-space:nowrap;
    }
    #mobile-post-btn:hover{ border-color:var(--gold-bright); color:var(--gold-bright); }
    #mobile-ask-btn{ color:var(--gold-bright); border-color:var(--gold); }
    #mobile-ask-btn:hover{ background:rgba(184,147,74,0.12); }
    #mobile-composer button:disabled{ opacity:.45; cursor:default; }
  }
  @media (min-width: 900px){
    #summary-btn-mobile{ display:none; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <h1>Skynet Like</h1>
      <span class="status-dot"></span>
    </div>
    <button id="summary-btn-mobile">最近の要約</button>
  </header>

  <div id="layout">
    <div id="board-col">
      <div id="board-scroll">
        <p class="posts-heading">TODAY'S POSTS</p>
        <div id="posts"><p class="empty">読み込み中...</p></div>
      </div>
      <div id="board-composer">
        <textarea id="board-input" placeholder="投稿する..." maxlength="500"></textarea>
        <button id="board-post-btn">投稿する</button>
      </div>
    </div>

    <aside id="ai-col">
      <div id="summary-btn-wrap">
        <button id="summary-btn-desktop">最近の要約</button>
      </div>
      <div class="ai-name">AI ASSISTANT — Sky</div>
      <div id="chat-log"></div>
      <div id="chat-input-wrap">
        <textarea id="chat-input" placeholder="Skyに質問する..." maxlength="500"></textarea>
        <button id="chat-send">送信</button>
      </div>
    </aside>
  </div>

  <div id="mobile-bar">
    <div id="mobile-ai-panel"></div>
    <div id="mobile-composer">
      <textarea id="mobile-input" placeholder="投稿する、またはSkyに質問する..." maxlength="500"></textarea>
      <button id="mobile-post-btn">投稿</button>
      <button id="mobile-ask-btn">Skyに質問</button>
    </div>
  </div>
</div>

<script>
/* ▼▼▼ ここにデプロイしたCloudflare WorkerのURLを設定してください ▼▼▼ */
const WORKER_URL_RAW = "https://proud-dew-b8a0.18-kota-shobun.workers.dev/";
const WORKER_URL = WORKER_URL_RAW.replace(/\/+$/, '');
/* ▲▲▲ ここまで ▲▲▲ ---------------------------------------------- */

const postsEl = document.getElementById('posts');

const boardInput = document.getElementById('board-input');
const boardPostBtn = document.getElementById('board-post-btn');

const mobileInput = document.getElementById('mobile-input');
const mobilePostBtn = document.getElementById('mobile-post-btn');
const mobileAskBtn = document.getElementById('mobile-ask-btn');
const mobileAiPanel = document.getElementById('mobile-ai-panel');

const summaryBtnDesktop = document.getElementById('summary-btn-desktop');
const summaryBtnMobile = document.getElementById('summary-btn-mobile');
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');

let conversationStarted = false;

// ---- Markdown描画(AIの回答のみに適用) ----
function renderMarkdown(text){
  try{
    const html = marked.parse(text || '');
    return DOMPurify.sanitize(html);
  }catch(e){
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }
}

// ---- 投稿一覧 ----
function fmtTime(iso){
  const m = iso.match(/(\d{2}):(\d{2})/);
  return m ? `${m[1]}:${m[2]}` : iso;
}

async function loadPosts(){
  try{
    const res = await fetch(`${WORKER_URL}/api/posts`);
    const data = await res.json();
    if(!data.posts || !data.posts.length){
      postsEl.innerHTML = '<p class="empty">本日の投稿はまだありません。最初の投稿をしてみましょう。</p>';
      return;
    }
    postsEl.innerHTML = data.posts.map(p => `
      <div class="post">
        <div class="post-time">${fmtTime(p.created_at)}</div>
        <div class="post-content"></div>
      </div>
    `).join('');
    const bodies = postsEl.querySelectorAll('.post-content');
    data.posts.forEach((p, i) => { bodies[i].textContent = p.content; });
  }catch(e){
    postsEl.innerHTML = '<p class="empty">投稿の読み込みに失敗しました。WORKER_URLの設定を確認してください。</p>';
  }
}

async function submitPost(text, {clearInputs} = {}){
  if(!text) return;
  try{
    const res = await fetch(`${WORKER_URL}/api/posts`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({content:text})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    if(clearInputs) clearInputs();
    await loadPosts();
  }catch(e){
    alert('投稿に失敗しました。WORKER_URLの設定を確認してください。');
  }
}

boardPostBtn.onclick = () => {
  const text = boardInput.value.trim();
  boardPostBtn.disabled = true;
  submitPost(text, {clearInputs: () => { boardInput.value=''; }}).finally(() => boardPostBtn.disabled=false);
};
boardInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); boardPostBtn.click(); }
});

mobilePostBtn.onclick = () => {
  const text = mobileInput.value.trim();
  mobilePostBtn.disabled = true;
  submitPost(text, {clearInputs: () => { mobileInput.value=''; }}).finally(() => mobilePostBtn.disabled=false);
};

// ---- AIチャット(PC: 右カラム / スマホ: 下部パネル、両方に同じ内容を描画) ----
function appendMessage(role, content, {loading=false} = {}){
  conversationStarted = true;
  summaryBtnDesktop.classList.add('hidden');

  const who = role === 'user' ? 'YOU' : 'SKY';
  const bubbleHtml = role === 'ai'
    ? renderMarkdown(content)
    : `<div class="bubble">${escapeText(content)}</div>`;

  const wrapDesktop = document.createElement('div');
  wrapDesktop.className = `msg ${role}`;
  wrapDesktop.innerHTML = role === 'ai'
    ? `<div class="who">${who}</div><div class="bubble${loading ? ' loading' : ''}">${bubbleHtml}</div>`
    : `<div class="who">${who}</div>${bubbleHtml}`;
  chatLog.appendChild(wrapDesktop);
  chatLog.scrollTop = chatLog.scrollHeight;

  mobileAiPanel.classList.add('show');
  const wrapMobile = wrapDesktop.cloneNode(true);
  mobileAiPanel.appendChild(wrapMobile);
  mobileAiPanel.scrollTop = mobileAiPanel.scrollHeight;

  return { desktop: wrapDesktop, mobile: wrapMobile };
}

function updateMessage(nodes, role, content){
  const bubbleHtml = role === 'ai' ? renderMarkdown(content) : escapeText(content);
  [nodes.desktop, nodes.mobile].forEach(node => {
    const bubble = node.querySelector('.bubble');
    bubble.classList.remove('loading');
    bubble.innerHTML = bubbleHtml;
  });
}

function escapeText(text){
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

async function askAI(mode, question){
  if(mode === 'ask'){
    appendMessage('user', question);
  }
  const nodes = appendMessage('ai', mode === 'summary' ? '要約を生成中...' : '考え中...', {loading:true});

  try{
    const res = await fetch(`${WORKER_URL}/api/ai`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(mode === 'summary' ? {mode} : {mode, question})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    updateMessage(nodes, 'ai', data.text);
  }catch(e){
    updateMessage(nodes, 'ai', '⚠ AI応答の取得に失敗しました。WORKER_URL・APIキーの設定を確認してください。');
  }
}

function triggerSummary(){
  askAI('summary');
}
summaryBtnDesktop.onclick = triggerSummary;
summaryBtnMobile.onclick = () => {
  mobileAiPanel.classList.add('show');
  triggerSummary();
};

chatSend.onclick = () => {
  const q = chatInput.value.trim();
  if(!q) return;
  chatInput.value = '';
  askAI('ask', q);
};
chatInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); chatSend.click(); }
});

mobileAskBtn.onclick = () => {
  const q = mobileInput.value.trim();
  if(!q) return;
  mobileInput.value = '';
  askAI('ask', q);
};

loadPosts();
</script>
</body>
</html>
